<title>모델 블라인드 검수</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f4f5f7; --card:#ffffff; --ink:#15181d; --muted:#5b626d; --faint:#8a919c; --line:#dde1e7;
  --user:#e9ecf1; --accent:#1e5a56; --accent-ink:#ffffff; --accent-soft:#e3efed; --bad:#7a3b2e; --bad-soft:#f4e9e5;
  --focus:#2d6cdf;
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --paper:#111317; --card:#1a1d22; --ink:#eceef2; --muted:#a5acb7; --faint:#7d8591; --line:#2c3139;
    --user:#252a31; --accent:#6fc2b8; --accent-ink:#0d1a19; --accent-soft:#1d302e; --bad:#e5a494; --bad-soft:#35231f; --focus:#7aa7ff; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --paper:#111317; --card:#1a1d22; --ink:#eceef2; --muted:#a5acb7; --faint:#7d8591; --line:#2c3139;
  --user:#252a31; --accent:#6fc2b8; --accent-ink:#0d1a19; --accent-soft:#1d302e; --bad:#e5a494; --bad-soft:#35231f; --focus:#7aa7ff; }
body{background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:640px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h1{font-size:16px;font-weight:600;margin:0}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);white-space:nowrap}
.count b{color:var(--ink)}
.intro{margin-block:16px 8px;color:var(--muted);font-size:14px;display:grid;gap:6px}
.intro p{margin:0}
.save{font-size:13px;color:var(--faint);margin-block:4px 16px;min-height:1.4em}
.items{display:grid;gap:18px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.num{font-weight:600;font-size:14px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.why{font-size:12px;color:var(--muted)}
.ctx{font-size:13px;color:var(--muted);margin:0}
.user{background:var(--user);border-radius:12px;padding:10px 12px;font-weight:500}
.user small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-bottom:2px}
.ans{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.ans h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em}
.before{font-size:12px;color:var(--faint);margin:0}
.line{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.line.q{font-weight:500}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:2px}
.none{color:var(--faint);font-size:14px;margin:0}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;margin-top:4px}
.pick button{font:inherit;font-size:14px;font-weight:500;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:6px 4px}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick button.b[aria-pressed="true"]{background:var(--bad);color:var(--card);border-color:var(--bad)}
.pick button:focus-visible,.copy button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.skip{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 16px;margin-top:18px}
.copy{margin-top:18px;display:grid;gap:8px}
.copy pre{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-wrap;font-family:inherit}
.copy button{font:inherit;font-size:14px;min-height:44px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.pick button{transition:background .12s,border-color .12s}}
</style>
<div class="wrap">

  </section>
</div>

const picks = {};
let db = null;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const choicesOf = (it) => [...it.answers.map((a) => a.label), '모두 별로'];
function answer(a) {
  const box = el('div', 'ans');
  box.append(el('h3', null, '답변 ' + a.label));
  if (a.before) box.append(el('p', 'before', '바로 앞 질문: ' + a.before));
  let any = false;
  if (a.reply) { box.append(el('p', 'line', a.reply)); any = true; }
  if (a.question) { box.append(el('p', 'line q', a.question)); any = true; }
  if (a.kept) { box.append(el('p', 'line q', a.kept)); box.append(el('span', 'tag', '같은 질문을 다시 띄움')); any = true; }
  for (const n of a.note) { box.append(el('span', 'tag', n)); any = true; }
  if (!any) box.append(el('p', 'none', '(아무 말도 하지 않음)'));
  return box;
}
function render() {
  const root = $('items'); root.textContent = '';
  DATA.items.forEach((it, n) => {
    const card = el('article', 'item'); card.id = it.id;
    const head = el('div', 'head'); head.append(el('span', 'num', (n + 1) + (it.example ? ' · 예문' : '')), el('span', 'why', it.why)); card.append(head);
    card.append(el('p', 'ctx', '만남 목적 「' + it.purpose + '」' + (it.prevUser ? ' · 바로 앞에 한 말 「' + it.prevUser + '」' : ' · 첫 답')));
    const u = el('div', 'user'); u.append(el('small', null, '사용자'), document.createTextNode(it.text)); card.append(u);
    for (const a of it.answers) card.append(answer(a));
    const row = el('div', 'pick'); row.setAttribute('role', 'group'); row.setAttribute('aria-label', (n + 1) + '번 판정');
    choicesOf(it).forEach((c, j) => { const b = el('button', c === '모두 별로' ? 'b' : '', c); b.type = 'button'; b.id = it.id + '-' + j; b.dataset.item = it.id; b.dataset.choice = c; row.append(b); });
    card.append(row); root.append(card);
  });
  refresh();
}
function refresh() {
  let n = 0;
  for (const it of DATA.items) { const c = picks[it.id]; if (c) n++; choicesOf(it).forEach((k, j) => { const b = $(it.id + '-' + j); if (b) b.setAttribute('aria-pressed', c === k ? 'true' : 'false'); }); }
  $('count').textContent = ''; $('count').append(el('b', null, String(n)), document.createTextNode(' / ' + DATA.items.length + ' 골랐어요'));
  $('summary').textContent = DATA.items.map((it, i) => (i + 1) + ' ' + (picks[it.id] || '안 고름')).join('\n');
}
function loadLocal() { try { Object.assign(picks, JSON.parse(localStorage.getItem('model-picks') || '{}')); } catch (e) {} }
function saveLocal() { try { localStorage.setItem('model-picks', JSON.stringify(picks)); } catch (e) {} }
document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('.pick button'); if (!b) return;
  const id = b.dataset.item, choice = b.dataset.choice; const next = picks[id] === choice ? null : choice;
  if (next) picks[id] = next; else delete picks[id];
  refresh(); saveLocal(); if (!db) return;
  $('save').textContent = '저장하는 중…';
  try { const ref = db.doc('mpicks/' + id); if (next) await ref.set({ choice: next, at: new Date().toISOString() }); else await ref.delete(); $('save').textContent = '저장했어요.'; }
  catch (e) { $('save').textContent = '저장하지 못했어요. 다시 눌러 주세요.'; }
});
$('copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('summary').textContent); $('copyBtn').textContent = '복사했어요'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('summary')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copyBtn').textContent = '글자를 선택해 두었어요. 길게 눌러 복사하세요'; }
});
loadLocal(); render();
(async () => {
  try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { $('save').textContent = ''; $('copy').hidden = false; return; }
  db.collection('mpicks').onSnapshot((snap) => {
    for (const d of snap.docs) { const v = d.data(); if (v && typeof v.choice === 'string') picks[d.id] = v.choice; }
    for (const id of Object.keys(picks)) if (!snap.docs.some((d) => d.id === id)) delete picks[id];
    saveLocal(); refresh();
  }, () => { $('copy').hidden = false; });
})();
</script>
