.before{font-size:12px;color:var(--faint);margin:0}
.line{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.line.q{font-weight:500}
.tag{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-top:2px}
.none{color:var(--faint);font-size:14px;margin:0}
.pick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.pick button{font:inherit;font-size:14px;font-weight:500;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:6px 4px}

.copy{margin-top:18px;display:grid;gap:8px}

  if (a.question) { box.append(el('p', 'line q', a.question)); any = true; }
  if (a.kept) { box.append(el('p', 'line q', a.kept)); box.append(el('span', 'tag', '같은 질문을 다시 띄움')); any = true; }
  for (const n of a.note) { box.append(el('span', 'tag', n)); any = true; }
  if (!any) box.append(el('p', 'none', '(아무 말도 하지 않음)'));
  return box;
}

function render() {
  const root = $('items');
  root.textContent = '';
  for (const it of DATA.items) {
    const card = el('article', 'item'); card.id = it.id;
    const head = el('div', 'head');
    head.append(el('span', 'num', it.id + (it.example ? ' · 예문' : '')), el('span', 'why', it.why));
    card.append(head);
    card.append(el('p', 'ctx', '만남 목적 「' + it.purpose + '」' + (it.prevUser ? ' · 바로 앞에 한 말 「' + it.prevUser + '」' : ' · 첫 답')));
    const u = el('div', 'user'); u.append(el('small', null, '사용자'), document.createTextNode(it.text)); card.append(u);
    card.append(answer('X', it.X), answer('Y', it.Y));
    const row = el('div', 'pick'); row.setAttribute('role', 'group'); row.setAttribute('aria-label', it.id + ' 판정');
    for (const k of ['X', 'Y', 'BOTH_BAD']) {
      const b = el('button', k === 'BOTH_BAD' ? 'b' : '', LABEL[k]); b.type = 'button';
      b.id = it.id + '-' + k; b.dataset.item = it.id; b.dataset.choice = k;
      b.setAttribute('aria-pressed', picks[it.id] === k ? 'true' : 'false');
      row.append(b);
    }
    card.append(row);
    root.append(card);
  }
  $('skip').textContent = '검수하지 않는 말: ' + DATA.noDiff.map((t) => '「' + t + '」').join(' · ') + ' — 두 AI 모두 대화가 이미 끝나 답하지 않았어요(두 쪽이 같음).';
  refresh();
}

function refresh() {
  let n = 0;
  for (const it of DATA.items) {
    const c = picks[it.id];
    if (c) n++;
    for (const k of ['X', 'Y', 'BOTH_BAD']) { const b = $(it.id + '-' + k); if (b) b.setAttribute('aria-pressed', c === k ? 'true' : 'false'); }
  }
  $('count').innerHTML = '';
  const bold = el('b', null, String(n)); $('count').append(bold, document.createTextNode(' / ' + DATA.items.length + ' 골랐어요'));
  $('summary').textContent = DATA.items.map((it) => it.id + ' ' + (picks[it.id] ? LABEL[picks[it.id]] : '안 고름')).join('\n');
}

function loadLocal() { try { const s = JSON.parse(localStorage.getItem('p0-picks') || '{}'); Object.assign(picks, s); } catch (e) {} }
function saveLocal() { try { localStorage.setItem('p0-picks', JSON.stringify(picks)); } catch (e) {} }

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('.pick button');
  if (!b) return;
  const id = b.dataset.item, choice = b.dataset.choice;
  const next = picks[id] === choice ? null : choice;
  if (next) picks[id] = next; else delete picks[id];
  refresh(); saveLocal();
  if (!db) return;
  $('save').textContent = '저장하는 중…';
  try {
    const ref = db.doc('picks/' + id);
    if (next) await ref.set({ choice: next, at: new Date().toISOString() }); else await ref.delete();
    $('save').textContent = id + ' 저장했어요.';
  } catch (e) {
    $('save').textContent = '저장하지 못했어요. 다시 눌러 주세요.';
  }
});

$('copyBtn').addEventListener('click', async () => {
  const text = $('summary').textContent;
  try { await navigator.clipboard.writeText(text); $('copyBtn').textContent = '복사했어요'; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('summary')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('copyBtn').textContent = '글자를 선택해 두었어요. 길게 눌러 복사하세요'; }
});

loadLocal();
render();
(async () => {
  try { db = window.claude ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { $('save').textContent = ''; $('copy').hidden = false; return; }
  db.collection('picks').onSnapshot((snap) => {
    for (const d of snap.docs) { const v = d.data(); if (v && LABEL[v.choice]) picks[d.id] = v.choice; }
    for (const id of Object.keys(picks)) if (!snap.docs.some((d) => d.id === id)) delete picks[id];
    saveLocal(); refresh();
  }, () => { $('copy').hidden = false; });
})();
</script>
