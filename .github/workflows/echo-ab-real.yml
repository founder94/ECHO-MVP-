# ECHO A/B 실제 AI 검사(R&D · 운영 영향 0).
# - 무엇: 운영 A(doit-understanding v27 원본, 지문 고정)와 B-1.0 을 같은 고정 입력(Golden 34개)·같은 모델 조건으로 실제 OpenAI 에 돌린다.
# - 언제: 이 브랜치에서 product/spike/ab-20260925/run-request.json 이 바뀌어 push 될 때만(자동으로 돌지 않는다).
# - 키: GitHub 저장소 Secret `OPENAI_API_KEY_AB_TEST` 에서만 읽는다. 없으면 가짜로 돌지 않고 REAL_AI=BLOCKED 를 적고 끝낸다.
#   키는 코드·결과·로그에 쓰지 않는다(하네스가 출력하지 않고, GitHub 가 로그에서 가린다).
# - 운영 DB·운영 함수·운영 Secret·배포는 쓰지 않는다. 결과 파일은 이 실행의 첨부물(7일 보관)로만 남고 저장소에 커밋하지 않는다.
name: echo-ab-real

on:
  push:
    branches: ['claude/readdy-a-structure-server-ui-znauoh']
    paths: ['product/spike/ab-20260925/run-request.json']

permissions:
  contents: read

concurrency:
  group: echo-ab-real
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사 도구(제품 의존성 아님)
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          npm init -y >/dev/null
          npm i --no-audit --no-fund typescript@5.8.3 js-tiktoken@1.0.21
      - name: 회귀 검사(AI 호출 0)
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
        run: node --test spike/ab-20260925/regression.test.mjs spike/ab-20260925/agentB.test.mjs
      - name: 실제 AI A/B
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
          OPENAI_MODEL: ${{ vars.ECHO_AB_MODEL }}
          ECHO_PRICE_IN_PER_M: ${{ vars.ECHO_PRICE_IN_PER_M }}
          ECHO_PRICE_OUT_PER_M: ${{ vars.ECHO_PRICE_OUT_PER_M }}
        run: |
          mkdir -p ../ab-out
          set +e
          node spike/ab-20260925/run-ab.mjs --require-real --out ../ab-out/result.md --json ../ab-out/result.json --blind ../ab-out/blind.md --key ../ab-out/key.json
          code=$?
          echo "run-ab exit=$code"
          if [ -f ../ab-out/blind.md ]; then cat ../ab-out/blind.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f ../ab-out/result.md ]; then echo "::group::result.md"; cat ../ab-out/result.md; echo "::endgroup::"; fi
          if [ -f ../ab-out/result.json ]; then echo "::group::result.json (REAL_AI 상태)"; head -c 400 ../ab-out/result.json; echo; echo "::endgroup::"; fi
          exit $code
      - name: 결과 첨부(7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-ab-real-${{ github.run_id }}
          path: ab-out/
          retention-days: 7
          if-no-files-found: ignore
