# PR #12 운영 배포 전 관통 QA 전용(2026-09-27 대표 「FINAL PRE-DEPLOY VALIDATION」) — QA 브랜치에만 있다(PR #12 에 넣지 않음).
# - 사람이 직접 누를 때만(workflow_dispatch). 운영 DB·운영 함수·운영 Secret·배포 0.
# - mode qa_* : ECHO-QA(QA 프로젝트 하나) 배포·실환경 검사 — 운영 ref 는 대상이 될 수 없다(첫 단계에서 해시 비교로 막음). 비밀값 출력 0.
# - mode qa12 : 실제 서버 코드(doit-agent · doit-connect)를 메모리 DB 로 돌리고 AI 는 시험 키(OPENAI_API_KEY_AB_TEST)로 실제 OpenAI. 입력은 합성 문장.
name: echo-claude-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: '사용하지 않음(등록된 워크플로 입력 모양 유지)'
        required: false
        default: 'claude-haiku-4-5-20251001'
        type: choice
        options: ['claude-haiku-4-5-20251001', 'claude-sonnet-5']
      mode:
        description: 'qa12 = 메모리 DB 관통 · qa_deploy_and_test / qa_deploy_only / qa_test_only = ECHO-QA 실환경(QA 전용)'
        required: false
        default: 'qa12'
        type: choice
        options: ['qa12', 'qa_deploy_and_test', 'qa_deploy_only', 'qa_test_only', 'smoke', 'compare43']
      providers:
        description: '사용하지 않음'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: echo-claude-smoke
  cancel-in-progress: false

jobs:
  qa12:
    if: inputs.mode == 'qa12' || inputs.mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사 도구(제품 의존성 아님)
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          npm init -y >/dev/null
          npm i --no-audit --no-fund typescript@5.8.3
      - name: PR #12 관통 QA(실제 OpenAI · 메모리 DB)
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
        run: |
          set +e
          node qa-real/pr12-e2e.mjs --out ../qa12-result.json > /dev/null
          code=$?
          echo "pr12-e2e exit=$code"
          if [ -f ../qa12-result.json ]; then echo "::group::qa12-result.json"; cat ../qa12-result.json; echo; echo "::endgroup::"; fi
          exit $code

  qa_live:
    if: startsWith(inputs.mode, 'qa_')
    # QA 배포 자격증명은 GitHub Environment 「ECHO-QA」 안에만 둔다(저장소 전체 Secret 아님 · 다른 작업은 이 값을 못 읽음).
    environment: ECHO-QA
    env:
      QA_PROJECT_ID: mutniujeiyujhkobadkd
      PROD_REF_SHA256: 6b82b104206244c98d388bf7e31831832f46d495a69745eed9f94c4b0671834c
      ALLOWED_BRANCH: claude/echo-p0-qa-20260927
      UNDERSTANDING_SHA256: fb960018e6d9311226e061fd4e63f969ce794db510e21b0bc661c74598aa48da
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 안전 잠금(QA ref · 운영 ref 차단 · 브랜치 · 파일 검사)
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          [ "$QA_PROJECT_ID" = "mutniujeiyujhkobadkd" ] || { echo "FAIL: QA ref 불일치"; exit 1; }
          [ "$(printf '%s' "$QA_PROJECT_ID" | sha256sum | cut -d' ' -f1)" != "$PROD_REF_SHA256" ] || { echo "FAIL: 운영 ref 가 대상"; exit 1; }
          [ "$GITHUB_REF_NAME" = "$ALLOWED_BRANCH" ] || { echo "FAIL: 허용되지 않은 브랜치 $GITHUB_REF_NAME"; exit 1; }
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "FAIL: 수동 실행만"; exit 1; }
          [ "$HAS_TOKEN" = "true" ] || { echo "FAIL: SUPABASE_QA_ACCESS_TOKEN 없음"; exit 1; }
          WF=.github/workflows/echo-claude-smoke.yml
          # 배포 대상 옵션은 모두 QA 변수만 쓴다 · 운영 ref(해시 비교) 글자 0
          if grep -n -- '--project-ref' "$WF" | grep -v 'grep' | grep -v -- '--project-ref "$QA_PROJECT_ID"'; then echo "FAIL: QA 변수가 아닌 대상"; exit 1; fi
          for w in $(grep -oE '[a-z]{20}' "$WF" | sort -u); do
            if [ "$(printf '%s' "$w" | sha256sum | cut -d' ' -f1)" = "$PROD_REF_SHA256" ]; then echo "FAIL: 워크플로에 운영 ref"; exit 1; fi
          done
          echo "OK: QA=$QA_PROJECT_ID · branch=$GITHUB_REF_NAME · 운영 ref 차단"

      - name: 배포 묶음 만들기(doit-understanding = 운영 v29 + 승인 1줄 · 저장소 원본 사용 0)
        if: inputs.mode != 'qa_test_only'
        run: |
          set -euo pipefail
          C=product/qa-deploy/doit-understanding/index.ts
          [ "$(sha256sum "$C" | cut -d' ' -f1)" = "$UNDERSTANDING_SHA256" ] || { echo "FAIL: 배포 후보 해시 불일치"; exit 1; }
          CHANGED=$(diff product/qa-deploy/prod-v29/doit-understanding.index.ts "$C" | grep -c '^[<>]' || true)
          [ "$CHANGED" = "3" ] || { echo "FAIL: 운영 v29 대비 변경 줄 수 $CHANGED(승인 = 3)"; exit 1; }
          if grep -q 'v1\.1' "$C"; then echo "FAIL: 미승인 Agent v1.1 흔적"; exit 1; fi
          mkdir -p stage/supabase/functions
          cp -r product/supabase/functions/doit-agent product/supabase/functions/doit-connect stage/supabase/functions/
          rm -f stage/supabase/functions/doit-agent/*.test.* stage/supabase/functions/doit-connect/*.test.*
          mkdir -p stage/supabase/functions/doit-understanding && cp "$C" stage/supabase/functions/doit-understanding/index.ts
          printf 'project_id = "%s"\n\n[functions.doit-agent]\nverify_jwt = true\n\n[functions.doit-connect]\nverify_jwt = true\n\n[functions.doit-understanding]\nverify_jwt = true\n' "$QA_PROJECT_ID" > stage/supabase/config.toml
          grep -q 'echo-agent-v2.2.2' stage/supabase/functions/doit-agent/agent.ts || { echo "FAIL: Agent 판 불일치"; exit 1; }
          ( cd stage && find supabase/functions -name '*.ts' -exec sha256sum {} \; | sort -k2 )

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: QA 프로젝트 접근 확인(토큰으로 QA 가 보이는지만 · 목록 출력 0)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase projects list -o json > /tmp/p.json
          jq -e --arg r "$QA_PROJECT_ID" 'map(select(.id == $r or .ref == $r)) | length == 1' /tmp/p.json > /dev/null || { echo "FAIL: 토큰으로 QA 프로젝트가 안 보임"; exit 1; }
          echo "참고: 토큰으로 보이는 프로젝트 수 $(jq 'length' /tmp/p.json) (토큰 범위 판정 근거 아님 · 범위는 토큰을 만든 화면의 설정 기준)"
          rm -f /tmp/p.json

      - name: QA 함수 3개 배포
        if: inputs.mode != 'qa_test_only'
        working-directory: stage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for f in doit-agent doit-connect doit-understanding; do
            supabase functions deploy "$f" --project-ref "$QA_PROJECT_ID" --use-api
          done

      - name: QA 비밀값(MATCH_SOURCE=agent · 시험용 AI 키) — 값 출력 0
        if: inputs.mode != 'qa_test_only'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          QA_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
        run: |
          set -euo pipefail
          [ -n "$QA_OPENAI_KEY" ] || { echo "FAIL: 시험용 AI 키 없음"; exit 1; }
          umask 077; F=$(mktemp)
          printf 'MATCH_SOURCE=agent\nOPENAI_API_KEY=%s\n' "$QA_OPENAI_KEY" > "$F"
          supabase secrets set --project-ref "$QA_PROJECT_ID" --env-file "$F" > /dev/null
          rm -f "$F"
          supabase secrets list --project-ref "$QA_PROJECT_ID" -o json | jq -r '.[].name' | sort

      - name: 배포 확인(QA ref · 함수 이름 · 판 · 해시)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$QA_PROJECT_ID" -o json | jq -r '.[] | [.slug, .version, .status, .verify_jwt, (.ezbr_sha256 // "-"), .updated_at] | @tsv'
          echo "대상 ref = $QA_PROJECT_ID"

      - uses: actions/setup-node@v4
        if: inputs.mode != 'qa_deploy_only'
        with:
          node-version: '22'

      - name: 실환경 관통 검사(실제 로그인 · 실제 RLS · 실제 AI)
        if: inputs.mode != 'qa_deploy_only'
        working-directory: product
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          K=$(supabase projects api-keys --project-ref "$QA_PROJECT_ID" -o json --reveal 2>/dev/null || supabase projects api-keys --project-ref "$QA_PROJECT_ID" -o json)
          QA_ANON=$(printf '%s' "$K" | jq -r '.[] | select(.name == "anon") | .api_key')
          QA_SERVICE=$(printf '%s' "$K" | jq -r '.[] | select(.name == "service_role") | .api_key')
          echo "::add-mask::$QA_ANON"; echo "::add-mask::$QA_SERVICE"
          unset K
          [ -n "$QA_ANON" ] && [ -n "$QA_SERVICE" ] || { echo "FAIL: QA 키를 읽지 못함"; exit 1; }
          set +e
          QA_REF="$QA_PROJECT_ID" QA_URL="https://$QA_PROJECT_ID.supabase.co" QA_ANON="$QA_ANON" QA_SERVICE="$QA_SERVICE" node qa-real/qa-live.mjs --out ../qa-live-result.json > /dev/null
          code=$?
          echo "qa-live exit=$code"
          if [ -f ../qa-live-result.json ]; then echo "::group::qa-live-result.json"; cat ../qa-live-result.json; echo; echo "::endgroup::"; fi
          exit $code
