# Claude Provider smoke test — 대표 「CLAUDE API SMOKE TEST PREP」(2026-09-27).
# - 언제: 사람이 Actions 화면에서 직접 누를 때만(workflow_dispatch · 자동 실행 0 · push 로 돌지 않음 — 대표 「CLAUDE-ONLY SMOKE TEST APPROVAL」 §6).
#   (수동 실행 버튼은 이 파일이 기본 브랜치에 있어야 보인다 — GitHub 규칙.)
# - 하는 일: 회귀 검사(AI 0) → 모델 목록 1회 → 생성 호출 정확히 1회(합성 입력). 43판 0.
#   providers 입력을 적으면 같은 방식으로 적은 업체마다 1회(3-Provider smoke). 이 파일이 수동 실행 가능한 등록 워크플로라 여기에 둔다
#   (echo-provider-smoke.yml 은 기본 브랜치에 없어서 GitHub 가 수동 실행을 받지 않는다 — 404).
# - 키: 저장소 Secret `ANTHROPIC_API_KEY_AB_TEST` 만(시험 전용). 없으면 SECRET=MISSING 으로 끝난다. 키는 로그·결과에 쓰지 않는다.
# - 운영 DB·운영 함수·운영 Secret·배포는 쓰지 않는다.
name: echo-claude-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: '모델(공식 목록 확인된 ID만 · 비용 원칙: 저비용 Haiku 우선)'
        required: true
        default: 'claude-haiku-4-5-20251001'
        type: choice
        options: ['claude-haiku-4-5-20251001', 'claude-sonnet-5']
      mode:
        description: 'smoke(기본 · 업체마다 1회) · compare43(대표 승인 뒤에만 · 사전 등록 FROZEN 의 v3.4 + 모델 3개로 43판씩)'
        required: false
        default: 'smoke'
        type: choice
        options: ['smoke', 'compare43']
      providers:
        description: '비우면 Claude 1회(위 model) · 적으면 3-Provider smoke(spike/provider-smoke/provider-smoke.mjs · 업체마다 1회) — 예: openai,gemini'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: echo-claude-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사 도구(제품 의존성 아님)
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          npm init -y >/dev/null
          npm i --no-audit --no-fund typescript@5.8.3 js-tiktoken@1.0.21
      - name: 부품·Router 가짜 검사(AI 호출 0)
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
          ECHO_AGENT_FILE: ./candidates/agent-v3.5.ts
        run: node --experimental-strip-types --test spike/agent-v1-20260925/router.test.mjs
      - name: Claude smoke(목록 1회 + 생성 1회)
        if: ${{ inputs.mode != 'compare43' && inputs.providers == '' }}
        working-directory: product
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_AB_TEST }}
          SMOKE_MODEL: ${{ inputs.model }}
        run: node --experimental-strip-types spike/provider-smoke/claude-smoke.mjs
      - name: 3-Provider smoke(업체마다 목록 1회 + 생성 1회 · 대표 「3-PROVIDER SMOKE TEST READY」)
        if: ${{ inputs.mode != 'compare43' && inputs.providers != '' }}
        working-directory: product
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_AB_TEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AB_TEST }}
          SMOKE_PROVIDERS: ${{ inputs.providers }}
        run: node --experimental-strip-types spike/provider-smoke/provider-smoke.mjs
      # 3-Provider 43판 비교(대표 「3-PROVIDER 43-CONVERSATION COMPARISON PREP」 · 승인 뒤 수동 실행에서만).
      # 모델 목록·서버 파일은 입력으로 받지 않는다 — 사전 등록(FROZEN_INPUTS.json prod_agent_gate)에서만 읽고, 서버·입력·모델이 등록과 다르면 실제 AI 를 돌리지 않는다(exit 3).
      # 업체 하나씩 단독(Router PRIMARY 하나 · 넘어가기 0 · Panel 0). run-request.json 은 쓰지 않는다.
      - name: 3-Provider 43판 비교(v3.4 · 업체 단독)
        if: ${{ inputs.mode == 'compare43' }}
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_AB_TEST }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_AB_TEST }}
          ECHO_ROUTER: '1'
        run: |
          mkdir -p ../ab-out
          export ECHO_AGENT_FILE=$(node -e "console.log(require('./spike/ab-20260925/FROZEN_INPUTS.json').prod_agent_gate.agent_file)")
          echo "agent_file=$ECHO_AGENT_FILE"
          set +e
          MODELS=$(node -e "console.log(require('./spike/ab-20260925/FROZEN_INPUTS.json').prod_agent_gate.models.join(','))")
          node --experimental-strip-types spike/agent-v1-20260925/run-prod-agent.mjs --require-real --models "$MODELS" --out ../ab-out/compare43-result.md --json ../ab-out/compare43-result.json --perf ../ab-out/model-performance.jsonl
          code=$?
          echo "run-prod-agent exit=$code"
          if [ -f ../ab-out/compare43-result.json ]; then echo "::group::compare43-result.json"; cat ../ab-out/compare43-result.json; echo; echo "::endgroup::"; fi
          if [ -f ../ab-out/compare43-result.md ]; then echo "::group::compare43-result.md"; cat ../ab-out/compare43-result.md; echo "::endgroup::"; fi
          if [ -f ../ab-out/model-performance.jsonl ]; then echo "::group::model-performance.jsonl"; cat ../ab-out/model-performance.jsonl; echo "::endgroup::"; fi
          exit $code
      - name: 비교 결과 첨부(7일)
        if: ${{ always() && inputs.mode == 'compare43' }}
        uses: actions/upload-artifact@v4
        with:
          name: echo-compare43-${{ github.run_id }}
          path: ab-out/
          retention-days: 7
          if-no-files-found: ignore
