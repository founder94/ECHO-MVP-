      ALLOWED_BRANCH: claude/echo-p0-qa-20260927
      UNDERSTANDING_SHA256: fb960018e6d9311226e061fd4e63f969ce794db510e21b0bc661c74598aa48da
      # QA 공개 키(anon · 브라우저에 공개되는 값 · 출처: Supabase 연결 도구의 QA 프로젝트 get_publishable_keys · 운영 키 아님)
      QA_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw
    steps:
      - uses: actions/checkout@v4

      - name: 안전 잠금(QA ref · 운영 ref 차단 · 브랜치 · 수동 실행 · Environment 토큰 존재)
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN != '' }}
          QA_RUN: ${{ inputs.qa_run }}
        run: |
          set -euo pipefail
          [ "$QA_PROJECT_ID" = "mutniujeiyujhkobadkd" ] || { echo "FAIL: QA ref 불일치"; exit 1; }
          [ "$(printf '%s' "$QA_PROJECT_ID" | sha256sum | cut -d' ' -f1)" != "$PROD_REF_SHA256" ] || { echo "FAIL: 운영 ref 가 대상"; exit 1; }
          [ "$GITHUB_REF_NAME" = "$ALLOWED_BRANCH" ] || { echo "FAIL: 허용되지 않은 브랜치 $GITHUB_REF_NAME"; exit 1; }
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "FAIL: 수동 실행만"; exit 1; }
          [ "$HAS_TOKEN" = "true" ] || { echo "FAIL: ECHO-QA Environment 의 SUPABASE_QA_ACCESS_TOKEN 없음"; exit 1; }
          printf '%s' "$QA_RUN" | grep -Eq '^[a-z0-9]{1,12}$' || { echo "FAIL: qa_run 형식"; exit 1; }
          WF=.github/workflows/echo-claude-smoke.yml
          # 자동 실행 0: on 아래는 workflow_dispatch 하나뿐
          python3 -c "import yaml,sys; d=yaml.safe_load(open('$WF')); t=d.get(True, d.get('on')); sys.exit(0 if list(t)==['workflow_dispatch'] else 1)" || { echo "FAIL: 자동 실행 트리거 존재"; exit 1; }
          # 배포 대상 옵션은 모두 QA 변수만 쓴다
          if grep -n -- '--project-ref' "$WF" | grep -v 'grep' | grep -v -- '--project-ref "$QA_PROJECT_ID"'; then echo "FAIL: QA 변수가 아닌 대상"; exit 1; fi
          # 운영 ref 글자는 「읽기 1회 거부 확인」 줄에만 허용(배포·비밀값·함수·대상 옵션이 있는 줄에 있으면 중단)
          while IFS= read -r line; do
            for w in $(printf '%s' "$line" | grep -oE '[a-z]{20}' || true); do
              if [ "$(printf '%s' "$w" | sha256sum | cut -d' ' -f1)" = "$PROD_REF_SHA256" ]; then
                printf '%s' "$line" | grep -Eq 'PROD_PROBE_REF: ' || { echo "FAIL: 운영 ref 가 읽기 확인 줄 밖에 있음"; exit 1; }
                printf '%s' "$line" | grep -Eqi 'deploy|secrets|project-ref|functions|-X |POST|PATCH|DELETE|PUT' && { echo "FAIL: 운영 ref 줄에 쓰기 동작"; exit 1; }
              fi
            done
          done < "$WF"
          echo "OK: QA=$QA_PROJECT_ID · branch=$GITHUB_REF_NAME · 수동 실행 · 자동 트리거 0 · 운영 ref 는 읽기 확인 줄에만"

      - name: 자격 사전 점검(QA 읽기 성공 · 운영 읽기 1회 거부 · 값 출력 0)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          PROD_PROBE_REF: zyyhhxyupizcqhxqnxuu
        run: |
          set -euo pipefail
          qa=$(curl -s -o /tmp/qa.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$QA_PROJECT_ID")
          [ "$qa" = "200" ] && [ "$(jq -r '.id // .ref' /tmp/qa.json)" = "$QA_PROJECT_ID" ] || { echo "FAIL: QA 프로젝트 읽기 실패 status=$qa"; rm -f /tmp/qa.json; exit 1; }
          echo "QA 읽기: 200 · name=$(jq -r '.name' /tmp/qa.json) · region=$(jq -r '.region' /tmp/qa.json) · status=$(jq -r '.status' /tmp/qa.json)"
          rm -f /tmp/qa.json
          pr=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$PROD_PROBE_REF")
          echo "운영 읽기 시도(GET 1회): status=$pr"
          case "$pr" in 401|403|404) echo "OK: 이 토큰은 운영 프로젝트를 읽지 못함";; *) echo "FAIL: 토큰이 운영 프로젝트를 읽을 수 있음(status=$pr) → 배포 금지 · HOLD"; exit 1;; esac

      - name: QA 인증 설정 읽기(GET 1회 · Google 켜짐·ID/비밀값 입력 여부만 · 값 출력 0)
        if: inputs.mode == 'qa_preflight' || inputs.mode == 'qa_admin_live'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          st=$(curl -s -o /tmp/auth.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$QA_PROJECT_ID/config/auth")
          echo "QA auth config 읽기: status=$st"
          if [ "$st" = "200" ]; then
            jq -r '"google_enabled=\(.external_google_enabled) · google_client_id_입력=\((.external_google_client_id // "") | length > 0) · google_secret_입력=\((.external_google_secret // "") | length > 0) · site_url=\(.site_url) · redirect_목록=\(.uri_allow_list) · confirm_email_off=\(.mailer_autoconfirm)"' /tmp/auth.json
          fi
          rm -f /tmp/auth.json

      - name: 배포 묶음 만들기(doit-understanding = 운영 v29 + 승인 1줄 · 저장소 원본 사용 0)
        if: inputs.mode == 'qa_deploy_and_signup' || inputs.mode == 'qa_deploy_only'
        run: |
          set -euo pipefail
          # B·C·D: doit-agent · doit-connect · admin-web = MVP LOOP 브랜치 검사본(cffb78e · ADMIN WEB 27b8102 + 2026-09-28 대표 「FINAL MVP IMPLEMENTATION MASTER」 doit-connect v2.0)과 글자까지 같아야 함
          git fetch -q --depth=1 origin claude/echo-mvp-loop-20260928
          [ "$(git rev-parse --short=7 FETCH_HEAD)" = "cffb78e" ] || { echo "FAIL: MVP LOOP 브랜치 head 가 검사본(cffb78e)이 아님: $(git rev-parse --short=7 FETCH_HEAD)"; exit 1; }
          git diff --quiet FETCH_HEAD HEAD -- product/supabase/functions/doit-agent product/supabase/functions/doit-connect product/supabase/functions/admin-web || { echo "FAIL: 함수가 검사본과 다름"; exit 1; }
          echo "OK: doit-agent · doit-connect · admin-web = cffb78e 와 동일"
          grep -q 'doit-connect — 연결 서버 (v2.0' product/supabase/functions/doit-connect/index.ts || { echo "FAIL: doit-connect 판 불일치(v2.0 아님)"; exit 1; }
          C=product/qa-deploy/doit-understanding/index.ts
          [ "$(sha256sum "$C" | cut -d' ' -f1)" = "$UNDERSTANDING_SHA256" ] || { echo "FAIL: 배포 후보 해시 불일치"; exit 1; }
          diff product/qa-deploy/prod-v29/doit-understanding.index.ts "$C" > /tmp/d.txt || true
          [ "$(grep -c '^[<>]' /tmp/d.txt)" = "3" ] && grep -q 'readiness.phone_verified;$' /tmp/d.txt && grep -q '대표 「P0-1」' /tmp/d.txt || { echo "FAIL: 운영 v29 대비 승인 범위 밖 변경"; cat /tmp/d.txt | head -20; exit 1; }
          if grep -q 'v1\.1' "$C"; then echo "FAIL: 미승인 Agent v1.1 흔적"; exit 1; fi
          [ "$(wc -l < "$C")" = "$(( $(wc -l < product/qa-deploy/prod-v29/doit-understanding.index.ts) + 1 ))" ] || { echo "FAIL: 줄 수가 운영 v29 + 1 이 아님(미배포 코드 혼입 의심)"; exit 1; }
          echo "OK: 운영 v29 대비 변경 = 승인 1줄(전화 인증 조건 제거 + 주석) · v1.1 흔적 0"
          mkdir -p stage/supabase/functions
          cp -r product/supabase/functions/doit-agent product/supabase/functions/doit-connect product/supabase/functions/admin-web stage/supabase/functions/
          grep -q 'ADMIN_WEB_VERSION = "admin-web-v1.0.0"' stage/supabase/functions/admin-web/index.ts || { echo "FAIL: admin-web 판 불일치"; exit 1; }
          if grep -nE '\.(insert|update|upsert|delete)\(' stage/supabase/functions/admin-web/index.ts; then echo "FAIL: admin-web 에 쓰기 코드"; exit 1; fi
          mkdir -p stage/supabase/functions/doit-understanding && cp "$C" stage/supabase/functions/doit-understanding/index.ts
          printf 'project_id = "%s"\n\n[functions.doit-agent]\nverify_jwt = true\n\n[functions.doit-connect]\nverify_jwt = true\n\n[functions.doit-understanding]\nverify_jwt = true\n\n[functions.admin-web]\nverify_jwt = true\n' "$QA_PROJECT_ID" > stage/supabase/config.toml
          grep -q 'export const AGENT_VERSION = "echo-agent-v2.4.1"' stage/supabase/functions/doit-agent/agent.ts || { echo "FAIL: Agent 판 불일치"; exit 1; }
          grep -q 'presented' stage/supabase/functions/doit-agent/agent.ts && grep -q 'DISPUTED' stage/supabase/functions/doit-agent/agent.ts || { echo "FAIL: 모호한 거절 규칙 없음"; exit 1; }
          ( cd stage && find supabase/functions -name '*.ts' -exec sha256sum {} \; | sort -k2 )

      - uses: supabase/setup-cli@v1
        if: inputs.mode == 'qa_deploy_and_signup' || inputs.mode == 'qa_deploy_only'
        with:
          version: latest

      - name: QA 함수 3개 배포(QA ref 만)
        if: inputs.mode == 'qa_deploy_and_signup' || inputs.mode == 'qa_deploy_only'
        working-directory: stage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for f in doit-agent doit-connect doit-understanding admin-web; do
            supabase functions deploy "$f" --project-ref "$QA_PROJECT_ID" --use-api
          done

      - name: QA 함수 비밀값(MATCH_SOURCE=agent · 시험용 AI 키 · 관리자 QA 주소 허용) — 값 출력 0 · 임시 파일 즉시 삭제
        if: inputs.mode == 'qa_deploy_and_signup' || inputs.mode == 'qa_deploy_only'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          QA_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
        run: |
          set -euo pipefail
          [ -n "$QA_OPENAI_KEY" ] || { echo "FAIL: 시험용 AI 키 없음"; exit 1; }
          umask 077; F=$(mktemp)
          # 2026-09-28 Netlify QA 자동배포: admin-web 은 허용 목록에 있는 주소만 받는다 → QA 관리자 사이트 주소 하나만(운영 주소 0).
          printf 'MATCH_SOURCE=agent\nOPENAI_API_KEY=%s\nADMIN_ALLOWED_ORIGINS=https://echo-admin-qa.netlify.app\n' "$QA_OPENAI_KEY" > "$F"
          supabase secrets set --project-ref "$QA_PROJECT_ID" --env-file "$F" > /dev/null; rc=$?
          rm -f "$F"; [ $rc = 0 ]
          echo "QA 비밀값 이름:"; supabase secrets list --project-ref "$QA_PROJECT_ID" -o json | jq -r '.[].name' | sort

      - name: 배포 확인(QA ref · 함수 이름 · 판 · 해시 · verify_jwt)
        if: inputs.mode == 'qa_deploy_and_signup' || inputs.mode == 'qa_deploy_only'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$QA_PROJECT_ID/functions" | jq -r '.[] | [.slug, ("v" + (.version|tostring)), .status, ("verify_jwt=" + (.verify_jwt|tostring)), (.ezbr_sha256 // "-"), (.updated_at|tostring)] | @tsv'
          echo "대상 ref = $QA_PROJECT_ID"

      - uses: actions/setup-node@v4
        if: inputs.mode == 'qa_deploy_and_signup' || inputs.mode == 'qa_full_test' || inputs.mode == 'qa_goal_runs' || inputs.mode == 'qa_admin_check' || inputs.mode == 'qa_admin_live'
        with:
          node-version: '22'

      - name: 실환경 검사(가입 단계 또는 로그인부터 관통)
        if: inputs.mode == 'qa_deploy_and_signup' || inputs.mode == 'qa_full_test'
        working-directory: product
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          QA_RUN: ${{ inputs.qa_run }}
          QA_PHASE: ${{ inputs.mode == 'qa_full_test' && 'full' || 'signup' }}
          QA_AGENT_VERSION: echo-agent-v2.4.1
        run: |
          set -euo pipefail
          QA_PW_SEED=$(printf 'echo-qa:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-40); echo "::add-mask::$QA_PW_SEED"
          unset SUPABASE_ACCESS_TOKEN
          set +e
          QA_REF="$QA_PROJECT_ID" QA_URL="https://$QA_PROJECT_ID.supabase.co" QA_PW_SEED="$QA_PW_SEED" node qa-real/qa-live.mjs --out ../qa-live-result.json > /dev/null
          code=$?
          echo "qa-live phase=$QA_PHASE exit=$code"
          if [ -f ../qa-live-result.json ]; then echo "::group::qa-live-result.json"; cat ../qa-live-result.json; echo; echo "::endgroup::"; fi
          exit $code

      - name: ADMIN WEB 검사(QA 전용 · 관리자 빌드를 러너 안에서 띄움 · 서버 401/403/200 · Chrome·WebKit 390/1280)
        if: inputs.mode == 'qa_admin_check'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          ADMIN_SHA: cffb78eef0734a42adfa5db7d87d605314fd6682
        run: |
          set -euo pipefail
          QA_PW_SEED=$(printf 'echo-qa:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-40); echo "::add-mask::$QA_PW_SEED"
          git fetch -q --depth=1 origin "$ADMIN_SHA" && git worktree add -q ../adm "$ADMIN_SHA"
          ( cd ../adm/product && npm ci --silent >/dev/null 2>&1 && VITE_PUBLIC_SUPABASE_URL="https://$QA_PROJECT_ID.supabase.co" VITE_PUBLIC_SUPABASE_ANON_KEY="$QA_ANON" VITE_SITE_ROLE=admin VITE_BUILD_COMMIT="${ADMIN_SHA:0:7}" npx vite build --outDir "$GITHUB_WORKSPACE/dist-admin" --emptyOutDir > /tmp/admin-build.log 2>&1 )
          echo "ADMIN BUILD ${ADMIN_SHA:0:7} · index sha16=$(sha256sum dist-admin/index.html | cut -c1-16) · files=$(find dist-admin -type f | wc -l) · maps=$(find dist-admin -name '*.map' | wc -l)"
          cd product
          QA_REF="$QA_PROJECT_ID" QA_PW_SEED="$QA_PW_SEED" node qa-real/admin-web-setup.mjs
          # QA 검사용 관리자 계정(qa-adminweb-20260928) 한 개만 QA DB 에서 관리자 역할(2026-09-28 · Supabase 연결 도구로 한 줄 지정 — 이 토큰은 DB 쓰기 권한 없음 · 권한 확대 0).
          unset SUPABASE_ACCESS_TOKEN
          (node qa-real/spa-serve.mjs "$GITHUB_WORKSPACE/dist-admin" 8790 &) ; sleep 1
          cd qa-real && npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          QA_REF="$QA_PROJECT_ID" QA_PW_SEED="$QA_PW_SEED" ADMIN_BASE=http://localhost:8790 ADMIN_EMAIL=qa-adminweb-20260928@do-it.company ADMIN_ACCT=adminweb USER_EMAIL=qa-userweb-20260928@do-it.company USER_ACCT=userweb node admin-web-check.mjs

      - name: ADMIN WEB 실사이트 검사(배포된 QA 관리자 사이트 echo-admin-qa · 서버 401/403/200 · Chrome·WebKit 390/1280 · 쓰기 0)
        if: inputs.mode == 'qa_admin_live'
        working-directory: product
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          QA_PW_SEED=$(printf 'echo-qa:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-40); echo "::add-mask::$QA_PW_SEED"
          unset SUPABASE_ACCESS_TOKEN
          BASE=https://echo-admin-qa.netlify.app
          echo "LIVE ADMIN index sha16=$(curl -s $BASE/ | sha256sum | cut -c1-16) · x-robots-tag=$(curl -s -D - -o /dev/null $BASE/ | tr -d '\r' | grep -i '^x-robots-tag' | cut -d' ' -f2-)"
          cd qa-real && npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          QA_REF="$QA_PROJECT_ID" QA_PW_SEED="$QA_PW_SEED" ADMIN_BASE=$BASE ADMIN_EMAIL=qa-adminweb-20260928@do-it.company ADMIN_ACCT=adminweb USER_EMAIL=qa-userweb-20260928@do-it.company USER_ACCT=userweb node admin-web-check.mjs

      - name: 앱·브랜드 실사이트 검사(배포된 echo-app-qa · echo-brand-qa · 로그인 없음 · 읽기 전용 · Chrome·WebKit 390/1280)
        if: always() && inputs.mode == 'qa_admin_live'
        working-directory: product/qa-real
        run: |
          set -euo pipefail
          for u in https://echo-app-qa.netlify.app https://echo-brand-qa.netlify.app; do echo "LIVE $u index sha16=$(curl -s $u/ | sha256sum | cut -c1-16)"; done
          [ -d node_modules/playwright ] || { npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1; }
          node live-sites-probe.mjs

      - name: 실제 AI 목적·세션 검사(friend·romantic·colleague·같은 계정 두 세션 각 20 · QA 전용)
        if: inputs.mode == 'qa_goal_runs'
        working-directory: product
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
          QA_RUN: ${{ inputs.qa_run }}
        run: |
          set -euo pipefail
          QA_PW_SEED=$(printf 'echo-qa:%s' "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-40); echo "::add-mask::$QA_PW_SEED"
          unset SUPABASE_ACCESS_TOKEN
          set +e
          QA_REF="$QA_PROJECT_ID" QA_PW_SEED="$QA_PW_SEED" N=20 PREFIX="$QA_RUN" ACCOUNT_PREFIX=gc SPECIAL_ONLY="${{ inputs.qa_run == 'gu' && 'unsure' || '' }}" OUT=../goal-runs.json node qa-real/qa-goal-runs.mjs
          code=$?
          echo "goal-runs exit=$code"
          exit $code
