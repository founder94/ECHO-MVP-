# PR #12 운영 배포 전 관통 QA 전용(2026-09-27 대표 「FINAL PRE-DEPLOY VALIDATION」) — QA 브랜치에만 있다(PR #12 에 넣지 않음).
# - 사람이 직접 누를 때만(workflow_dispatch). 운영 DB·운영 함수·운영 Secret·배포 0.
# - mode qa_* : ECHO-QA(QA 프로젝트 하나) 배포·실환경 검사 — 운영 ref 는 대상이 될 수 없다(첫 단계에서 해시 비교로 막음). 비밀값 출력 0.
# - mode qa12 : 실제 서버 코드(doit-agent · doit-connect)를 메모리 DB 로 돌리고 AI 는 시험 키(OPENAI_API_KEY_AB_TEST)로 실제 OpenAI. 입력은 합성 문장.
name: echo-claude-smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: '사용하지 않음(등록된 워크플로 입력 모양 유지)'
        required: false
        default: 'claude-haiku-4-5-20251001'
        type: choice
        options: ['claude-haiku-4-5-20251001', 'claude-sonnet-5']
      mode:
        description: 'qa12 = 메모리 DB 관통 · qa_preflight = 자격 사전 점검만 · qa_deploy_and_signup = 점검+배포+실제 가입 · qa_full_test = 점검+실제 로그인부터 관통(QA 전용)'
        required: false
        default: 'qa12'
        type: choice
        options: ['qa12', 'qa_preflight', 'qa_deploy_and_signup', 'qa_deploy_only', 'qa_full_test', 'qa_site_probe', 'qa_rc_check', 'qa_goal_runs', 'qa_admin_check', 'qa_admin_live', 'prod_brand_live', 'prod_app_live', 'prod_fortune_live', 'restart_live_qa', 'realstate_p0_qa', 'realstate_p0_localbuild', 'core_live_qa', 'agent_deploy_qa', 'prod_domain_probe', 'webkit_diag', 'connect_deploy_qa', 'connect_live_qa', 'prod_app_fingerprint', 'prod_secrets_preflight', 'webkit_purposes_diag', 'smoke', 'compare43']
      qa_run:
        description: 'QA 테스트 계정 묶음 이름(영문 소문자·숫자 12자 이하)'
        required: false
        default: 'r1'
        type: string
      providers:
        description: '사용하지 않음'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: echo-claude-smoke
  cancel-in-progress: false

jobs:
  qa12:
    if: inputs.mode == 'qa12' || inputs.mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사 도구(제품 의존성 아님)
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          npm init -y >/dev/null
          npm i --no-audit --no-fund typescript@5.8.3
      - name: PR #12 관통 QA(실제 OpenAI · 메모리 DB)
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
        run: |
          set +e
          node qa-real/pr12-e2e.mjs --out ../qa12-result.json > /dev/null
          code=$?
          echo "pr12-e2e exit=$code"
          if [ -f ../qa12-result.json ]; then echo "::group::qa12-result.json"; cat ../qa12-result.json; echo; echo "::endgroup::"; fi
          exit $code

  qa_site_probe:
    # 읽기 전용 PWA 실측: 실제 주소의 manifest·아이콘·index + 실제 Chrome 설치 가능 판정(비밀값·Environment·쓰기 0).
    if: inputs.mode == 'qa_site_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            product/qa-real/melba-render.mjs
            product/qa-real/results/qa-zip-1c43024-melba.sha256
      - name: 새 QA 주소 응답·해시 대조(주소당 1회 · 최소 요청)
        env:
          BASE: https://thriving-melba-b1449a.netlify.app
        working-directory: product/qa-real
        run: |
          set +e
          EXP=results/qa-zip-1c43024-melba.sha256
          code() { curl -sS -o "$2" --max-time 20 -w '%{http_code}' "$BASE$1"; }
          echo "/ : HTTP $(code / idx.html) · index sha16=$(sha256sum idx.html | cut -c1-16) (1c43024 기대 $(grep ' index.html$' $EXP | cut -c1-16))"
          JS=$(grep -o '/assets/index-[^"]*\.js' idx.html | head -1); CSS=$(grep -o '/assets/index-[^"]*\.css' idx.html | head -1)
          echo "main JS $JS : HTTP $(code "$JS" js.bin)"; echo "CSS $CSS : HTTP $(code "$CSS" css.bin)"
          echo "manifest : HTTP $(code /manifest.webmanifest mf.json) · $(jq -c '{name,short_name,id,start_url,scope,display,icons:[.icons[]|.src+" "+.sizes+" "+.purpose]}' mf.json 2>/dev/null)"
          echo "manifest 헤더: $(curl -sS -o /dev/null -D - "$BASE/manifest.webmanifest" | tr -d '\r' | grep -iE '^(content-type|cache-control|location):' | tr '\n' ' ')"
          echo "manifest 링크: $(grep -o '<link rel="manifest"[^>]*>' idx.html) · 메인 JS 공통 메뉴=$(grep -c 'echo-corner-button' js.bin)"
          echo "/ 헤더: $(curl -sS -o /dev/null -D - "$BASE/" | tr -d '\r' | grep -iE '^(content-type|x-frame-options|x-content-type-options|location):' | tr '\n' ' ')"
          for f in pwa/echo-icon-180.png pwa/echo-icon-192.png pwa/echo-icon-512.png pwa/echo-icon-512-maskable.png pwa/echo-icon-32.png favicon.svg; do
            st=$(code "/$f" ic.bin); got=$(sha256sum ic.bin | cut -d' ' -f1); want=$(grep " $f\$" $EXP | cut -d' ' -f1)
            [ "$got" = "$want" ] && m=일치 || m=불일치; echo "$f : HTTP $st · sha16=${got:0:16} · 승인 E 대조 $m"
          done
          echo "apple-touch-icon 링크: $(grep -o '<link rel="apple-touch-icon"[^>]*>' idx.html)"
          echo "apple 제목: $(grep -o '<meta name="apple-mobile-web-app-title"[^>]*>' idx.html)"
          echo "Supabase 대상: qa=$(grep -oE 'https://[a-z]+\.supabase\.co' js.bin | grep -c mutniujeiyujhkobadkd) 그밖=$(grep -oE 'https://[a-z]+\.supabase\.co' js.bin | grep -vc mutniujeiyujhkobadkd)"
          echo "움직임 줄이기 글자(메인 JS): $(grep -c '움직임 줄이기' js.bin)"
          L=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://mutniujeiyujhkobadkd.supabase.co/auth/v1/authorize?provider=google&redirect_to=$BASE/auth/callback")
          echo "Google authorize: HTTP ${L%% *} · host=$(echo "${L#* }" | cut -d/ -f3) · $(echo "${L#* }" | grep -o 'redirect_uri=[^&]*')"

      - name: Chrome·WebKit 실제 렌더(/ · 로그인·쓰기 0)
        working-directory: product/qa-real
        run: |
          npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node melba-render.mjs https://thriving-melba-b1449a.netlify.app

  qa_rc_check:
    # 배포 전 RC 검사(읽기 전용 · 비밀값 0): PR #12 의 지정 commit 을 QA 설정으로 빌드 → 러너 안에서 띄워 Chrome·WebKit 으로 연다. 배포 0.
    if: inputs.mode == 'qa_rc_check'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RC_SHA: 146e2af95f326e2050c4f7d2a40312d20ef46d53
      # QA 공개 키(anon · 브라우저에 공개되는 값 · 운영 키 아님)
      QA_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw
    steps:
      - uses: actions/checkout@v4
        with:
          path: qa
          sparse-checkout: |
            product/qa-real/rc-render.mjs
            product/qa-real/wk-diag.mjs
            product/qa-real/brand-render.mjs
            product/qa-real/spa-serve.mjs
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RC_SHA }}
          path: rc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: RC 빌드(QA 설정 · app 역할)
        working-directory: rc/product
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$RC_SHA" ]
          npm ci --silent >/dev/null 2>&1
          VITE_PUBLIC_SUPABASE_URL=https://mutniujeiyujhkobadkd.supabase.co VITE_PUBLIC_SUPABASE_ANON_KEY=$QA_ANON VITE_APP_ORIGIN=https://thriving-melba-b1449a.netlify.app VITE_BRAND_ORIGIN=https://thriving-melba-b1449a.netlify.app VITE_SITE_ROLE=app VITE_A_STRUCTURE_SERVER_ENABLED=true VITE_ECHO_FOLLOWUP_ENABLED=true VITE_ECHO_AGENT_ENABLED=true npx vite build --outDir ../../dist --emptyOutDir > ../../build.log 2>&1
          # 2026-09-28 §27: QA 표시 붙이기(qa-pwa-label) 없음 — 올릴 ZIP 과 같은 빌드
          echo "RC $RC_SHA · index sha16=$(sha256sum ../../dist/index.html | cut -c1-16) · files=$(find ../../dist -type f | wc -l) · maps=$(find ../../dist -name '*.map' | wc -l)"
      - name: Chrome·WebKit 렌더(iPhone·Galaxy 크기 · 로그인 없음)
        working-directory: qa/product/qa-real
        run: |
          (node spa-serve.mjs "$GITHUB_WORKSPACE/dist" 8770 &) ; sleep 1
          npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node rc-render.mjs http://localhost:8770 || true
      - name: BRAND QA 빌드 + Chrome·WebKit 확인(같은 commit · 읽기 전용)
        working-directory: rc/product
        run: |
          set -e
          VITE_PUBLIC_SUPABASE_URL=https://mutniujeiyujhkobadkd.supabase.co VITE_PUBLIC_SUPABASE_ANON_KEY=$QA_ANON VITE_APP_ORIGIN=https://thriving-melba-b1449a.netlify.app VITE_BRAND_ORIGIN=https://thriving-melba-b1449a.netlify.app VITE_SITE_ROLE=brand VITE_A_STRUCTURE_SERVER_ENABLED=true VITE_ECHO_FOLLOWUP_ENABLED=true VITE_ECHO_AGENT_ENABLED=true npx vite build --outDir ../../dist-brand --emptyOutDir > ../../build-brand.log 2>&1
          echo "BRAND $RC_SHA · index sha16=$(sha256sum ../../dist-brand/index.html | cut -c1-16) · files=$(find ../../dist-brand -type f | wc -l) · maps=$(find ../../dist-brand -name '*.map' | wc -l)"
          (node ../../qa/product/qa-real/spa-serve.mjs "$GITHUB_WORKSPACE/dist-brand" 8773 &) ; sleep 1
          cd ../../qa/product/qa-real && node brand-render.mjs http://localhost:8773

  prod_brand_live:
    # 운영 BRAND 실사이트 읽기 전용 확인(do-it.company → ECHO 시작하기 → app.do-it.company) · 비밀값·배포 0.
    if: inputs.mode == 'prod_brand_live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 운영 BRAND 실사이트(Galaxy·iPhone 크기 · Chrome·WebKit)
        working-directory: product/qa-real
        run: |
          set -euo pipefail
          npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node prod-brand-live.mjs

  prod_app_live:
    # 운영 APP 실사이트 읽기 전용 확인(app.do-it.company 연결 대상 = 운영 Supabase 하나뿐) · 비밀값·배포·가입 0.
    if: inputs.mode == 'prod_app_live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 운영 APP 실사이트(Galaxy·iPhone 크기 · Chrome·WebKit)
        working-directory: product/qa-real
        run: |
          set -euo pipefail
          npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node prod-app-live.mjs

  prod_fortune_live:
    # 운영 사주·타로 실제 동작 확인(읽기·계산만 · 로그인·저장 0 · 타로는 운영 openai-chat 실제 호출) · 비밀값·배포 0.
    if: inputs.mode == 'prod_fortune_live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 운영 사주·타로(Galaxy·iPhone 크기 · Chrome·WebKit)
        working-directory: product/qa-real
        run: |
          set -euo pipefail
          npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node prod-fortune-live.mjs

  restart_live_qa:
    # QA 「처음부터 다시 시작하기」 실제 동작(QA 사이트·QA DB 전용 · 새 시험 계정) · 운영 0 · 비밀값 0(QA 공개 키만).
    if: inputs.mode == 'restart_live_qa'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 나의 이해 → 처음부터 다시 시작하기 → ECHO 첫 대화(iPhone WebKit · Galaxy Chrome)
        working-directory: product/qa-real
        run: |
          set -euo pipefail
          npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node qa-restart-live.mjs

  realstate_p0_qa:
    # 대표 실기기와 같은 상태 재현(온보딩 끝난 계정 → /doit/start-journey) · 다시 시작 버튼 실제 렌더·탭 · 버튼 유리 스타일 · Google OAuth redirect_to(QA 전용 · 운영 0).
    if: inputs.mode == 'realstate_p0_qa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real-State Replay(iPhone WebKit · Galaxy Chrome)
        working-directory: product/qa-real
        run: |
          set -euo pipefail
          npm i --no-save --silent playwright@1.55.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          node qa-realstate-p0.mjs

  core_live_qa:
    # CORE 실서버 검사(QA 서버 doit-agent · 실제 AI · 새 시험 계정): 정정 · 거절된 의미 재등장 · 원문 보존 · 세션 격리. 배포 0 · 운영 0.
    if: inputs.mode == 'core_live_qa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 정정 · 거절 · 원문 보존 · 세션 격리(실서버)
        working-directory: product/qa-real
        run: node qa-core-live.mjs

  agent_deploy_qa:
    # QA 서버 doit-agent 1개만 배포(2026-09-29 AUTO · QA 전용 · 운영 0 · 비용 0): 고정 commit 의 3파일(index · agent · failure-intelligence)만 · 비밀값 변경 0.
    if: inputs.mode == 'agent_deploy_qa'
    environment: ECHO-QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_PROJECT_ID: mutniujeiyujhkobadkd
      PROD_REF_SHA256: 6b82b104206244c98d388bf7e31831832f46d495a69745eed9f94c4b0671834c
      AGENT_SHA: 75788b0399d8c09314b23e1cbfac9a0eb8b00c5d
      AGENT_VERSION: echo-agent-v2.5.5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75788b0399d8c09314b23e1cbfac9a0eb8b00c5d
          path: src
      - name: 안전 잠금(QA ref · 운영 ref 차단 · 수동 실행 · 고정 commit · Agent 판 · 3파일만)
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          [ "$QA_PROJECT_ID" = "mutniujeiyujhkobadkd" ] || { echo "FAIL: QA ref 불일치"; exit 1; }
          [ "$(printf '%s' "$QA_PROJECT_ID" | sha256sum | cut -d' ' -f1)" != "$PROD_REF_SHA256" ] || { echo "FAIL: 운영 ref 가 대상"; exit 1; }
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || { echo "FAIL: 수동 실행만"; exit 1; }
          [ "$HAS_TOKEN" = "true" ] || { echo "FAIL: ECHO-QA 토큰 없음"; exit 1; }
          [ "$(git -C src rev-parse HEAD)" = "$AGENT_SHA" ] || { echo "FAIL: 고정 commit 아님"; exit 1; }
          F=src/product/supabase/functions/doit-agent
          grep -q "export const AGENT_VERSION = \"$AGENT_VERSION\"" $F/agent.ts || { echo "FAIL: Agent 판 불일치"; exit 1; }
          mkdir -p stage/supabase/functions/doit-agent
          cp $F/index.ts $F/agent.ts $F/failure-intelligence.ts stage/supabase/functions/doit-agent/
          printf 'project_id = "%s"\n\n[functions.doit-agent]\nverify_jwt = true\n' "$QA_PROJECT_ID" > stage/supabase/config.toml
          ( cd stage && find supabase/functions -type f -exec sha256sum {} \; | sort -k2 )
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: QA doit-agent 배포(QA ref 만 · 이 함수 하나만)
        working-directory: stage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_QA_ACCESS_TOKEN }}
        run: supabase functions deploy doit-agent --project-ref "$QA_PROJECT_ID" --use-api

  connect_deploy_qa:
    # QA 서버 doit-connect 1개만 배포(2026-09-29 PROD PRE-FLIGHT · QA 전용 · 운영 0 · 비용 0): 고정 commit 의 3파일(index · agentSource · doit-agent/matching)만 · 비밀값 변경 0 → 배포 직후 실서버 계약 확인.
    if: inputs.mode == 'connect_deploy_qa'
    environment: ECHO-QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QA_PROJECT_ID: mutniujeiyujhkobadkd
      PROD_REF_SHA256: 6b82b104206244c98d388bf7e31831832f46d495a69745eed9f94c4b0671834c
      CONNECT_SHA: 3f0c591dc4c012145d2dd409820945b4e6932edd
