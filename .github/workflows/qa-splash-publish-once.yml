name: qa-splash-publish-once

on:
  push:
    branches: ['chatgpt/qa-splash-publish-once-20260930']
    paths: ['.github/workflows/qa-splash-publish-once.yml']

permissions:
  contents: read

concurrency:
  group: qa-splash-publish-once
  cancel-in-progress: false

env:
  NETLIFY_CLI: netlify-cli@27.10.0
  QA_SUPABASE_URL: https://mutniujeiyujhkobadkd.supabase.co
  QA_SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdXRuaXVqZWl5dWpoa29iYWRrZCIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw
  SITE_QA_APP: a9b101c6-121b-4371-adb9-4e42193dca24
  CANONICAL_SHA: 18157b5e67cb2cd9bdcdb2edc495582491703042
  EXPECTED_PRODUCT_TREE: b5893df75f9f61cf806c8820d17733d745017daa

jobs:
  publish:
    name: QA APP splash final publish once
    runs-on: ubuntu-latest
    environment: ECHO-QA
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: product
        run: npm ci --no-audit --no-fund
      - name: Build canonical QA APP only
        working-directory: product
        run: |
          set -euo pipefail
          C="${CANONICAL_SHA:0:7}"
          env VITE_PUBLIC_SUPABASE_URL="$QA_SUPABASE_URL"               VITE_PUBLIC_SUPABASE_ANON_KEY="$QA_SUPABASE_ANON"               VITE_APP_ORIGIN=https://echo-app-qa.netlify.app               VITE_BRAND_ORIGIN=https://echo-brand-qa.netlify.app               VITE_ADMIN_ORIGIN=https://echo-admin-qa.netlify.app               VITE_BUILD_COMMIT="$C"               VITE_SITE_ROLE=app               VITE_A_STRUCTURE_SERVER_ENABLED=true               VITE_ECHO_FOLLOWUP_ENABLED=true               VITE_ECHO_AGENT_ENABLED=true               npx vite build --outDir ../dist/app --emptyOutDir
      - name: Verify canonical product tree and splash artifact before spending credits
        run: |
          set -euo pipefail
          tree="$(git rev-parse HEAD:product)"
          echo "product tree=$tree"
          [ "$tree" = "$EXPECTED_PRODUCT_TREE" ] || { echo "HOLD: product source tree mismatch"; exit 1; }
          [ -f dist/app/index.html ]
          [ -f dist/app/pwa/echo-launch-artwork.webp ]
          [ "$(find dist/app -name '*.map' | wc -l)" = 0 ]
          ! grep -R -q -- 'zyyhhxyupizcqhxqnxuu' dist/app
          ! grep -R -q -- 'admin-web' dist/app
          grep -q 'class="echo-app-launch-root"' dist/app/index.html
          grep -q 'echo-launch-artwork.webp?v=20260930f' dist/app/index.html
          grep -q 'theme-color" content="#041433"' dist/app/index.html
          got="$(sha256sum dist/app/index.html | cut -c1-16)"
          echo "APP verified index sha16=$got"
      - name: Publish QA APP only (15 credits expected)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$NETLIFY_AUTH_TOKEN" ] || { echo "HOLD: NETLIFY_AUTH_TOKEN missing"; exit 1; }
          printf '[build]\n  publish = "."\n  command = "echo prebuilt"\n' > dist/app/netlify.toml
          (cd dist/app && npx -y $NETLIFY_CLI deploy --dir . --site "$SITE_QA_APP" --prod --no-build --json --message "QA splash final ${CANONICAL_SHA:0:7}" > /tmp/deploy.json)
          node -e 'const j=require("/tmp/deploy.json"); if(j.site_id!==process.env.SITE_QA_APP||!j.deploy_id) process.exit(1); console.log("deploy_id="+j.deploy_id)'
          want="$(sha256sum dist/app/index.html | cut -c1-16)"
          live=""
          for i in 1 2 3 4 5 6; do
            live="$(curl -s https://echo-app-qa.netlify.app/ | sha256sum | cut -c1-16)"
            [ "$live" = "$want" ] && break
            sleep 5
          done
          [ "$live" = "$want" ] || { echo "FAIL: live index mismatch $live != $want"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' https://echo-app-qa.netlify.app/)"
          [ "$code" = "200" ] || { echo "FAIL: HTTP $code"; exit 1; }
          echo "PASS echo-app-qa HTTP 200 index sha16=$live"
