name: qa-app-publish-menu-once-20260930

on:
  push:
    branches: ['chatgpt/qa-app-publish-menu-20260930']
    paths:
      - '.github/workflows/qa-app-publish-menu-once-20260930.yml'

permissions:
  contents: read

concurrency:
  group: qa-app-publish-menu-once-20260930
  cancel-in-progress: false

env:
  NETLIFY_CLI: netlify-cli@27.10.0
  QA_SUPABASE_URL: https://mutniujeiyujhkobadkd.supabase.co
  QA_SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw
  SITE_QA_APP: a9b101c6-121b-4371-adb9-4e42193dca24

jobs:
  publish:
    name: QA APP publish once
    runs-on: ubuntu-latest
    environment: ECHO-QA
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        working-directory: product
        run: npm ci --no-audit --no-fund
      - name: menu regression only
        working-directory: product
        run: node --test qa/app-corner-menu.test.mjs qa/app-root-product.test.mjs
      - name: build QA app from canonical product code
        working-directory: product
        env:
          VITE_PUBLIC_SUPABASE_URL: ${{ env.QA_SUPABASE_URL }}
          VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ env.QA_SUPABASE_ANON }}
          VITE_APP_ORIGIN: https://echo-app-qa.netlify.app
          VITE_BRAND_ORIGIN: https://echo-brand-qa.netlify.app
          VITE_ADMIN_ORIGIN: https://echo-admin-qa.netlify.app
          VITE_BUILD_COMMIT: 0bbf12c
          VITE_SITE_ROLE: app
          VITE_A_STRUCTURE_SERVER_ENABLED: 'true'
          VITE_ECHO_FOLLOWUP_ENABLED: 'true'
          VITE_ECHO_AGENT_ENABLED: 'true'
        run: npx vite build --outDir ../dist/app --emptyOutDir
      - name: deploy existing QA app site only
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SECRET_APP: ${{ secrets.NETLIFY_APP_QA_SITE_ID }}
        run: |
          set -euo pipefail
          [ -n "$NETLIFY_AUTH_TOKEN" ] || { echo "HOLD: NETLIFY_AUTH_TOKEN missing"; exit 1; }
          if [ -n "$SECRET_APP" ] && [ "$SECRET_APP" != "$SITE_QA_APP" ]; then
            echo "HOLD: QA APP site ID mismatch"
            exit 1
          fi
          printf '[build]\n  publish = "."\n  command = "echo prebuilt"\n' > dist/app/netlify.toml
          (cd dist/app && npx -y $NETLIFY_CLI deploy --dir . --site "$SITE_QA_APP" --prod --no-build --json --message "echo-qa 0bbf12c app menu visible" > /tmp/deploy.json 2> /tmp/deploy.err) || {
            echo "FAIL: QA APP deploy"
            tail -20 /tmp/deploy.err
            exit 1
          }
          node -e 'const j=require("/tmp/deploy.json"); if(j.site_id!==process.env.SITE_QA_APP||!j.deploy_id) process.exit(1); console.log("deploy_id="+j.deploy_id)'
          want=$(sha256sum dist/app/index.html | cut -c1-16)
          live=""
          for i in 1 2 3 4 5 6; do
            live=$(curl -s https://echo-app-qa.netlify.app/ | sha256sum | cut -c1-16)
            [ "$live" = "$want" ] && break
            sleep 5
          done
          [ "$live" = "$want" ] || { echo "FAIL: live index mismatch $live != $want"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' https://echo-app-qa.netlify.app/)
          echo "PASS QA APP live HTTP=$code index_sha16=$live"
