name: reconcile-v67-check

on:
  push:
    branches: ['chatgpt/reconcile-qa-v67-20260930']

permissions:
  contents: read

concurrency:
  group: reconcile-v67-check
  cancel-in-progress: true

env:
  QA_SUPABASE_URL: https://mutniujeiyujhkobadkd.supabase.co
  QA_SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtdXRuaXVqZWl5dWpoa29iYWRrZCIsInJlZiI6Im11dG5pdWplaXl1amhrb2JhZGtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NzQzNDksImV4cCI6MjEwNjA1MDM0OX0.914o6-qbGNldjADojI_O-ENi608O0ompYpkJD8hobyw

jobs:
  gate:
    name: source gate (deploy 0)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install
        working-directory: product
        run: npm ci --no-audit --no-fund
      - name: lint + type-check
        working-directory: product
        run: |
          npm run -s lint
          npm run -s type-check
      - name: full tests
        working-directory: product
        run: node --test qa/*.test.mjs qa/*.test.ts
      - name: role builds
        working-directory: product
        run: |
          set -euo pipefail
          C=${GITHUB_SHA::7}
          common="VITE_PUBLIC_SUPABASE_URL=$QA_SUPABASE_URL VITE_PUBLIC_SUPABASE_ANON_KEY=$QA_SUPABASE_ANON VITE_APP_ORIGIN=https://echo-app-qa.netlify.app VITE_BRAND_ORIGIN=https://echo-brand-qa.netlify.app VITE_ADMIN_ORIGIN=https://echo-admin-qa.netlify.app VITE_BUILD_COMMIT=$C"
          env $common VITE_SITE_ROLE=app VITE_A_STRUCTURE_SERVER_ENABLED=true VITE_ECHO_FOLLOWUP_ENABLED=true VITE_ECHO_AGENT_ENABLED=true npx vite build --outDir ../dist/app --emptyOutDir
          env $common VITE_SITE_ROLE=brand npx vite build --outDir ../dist/brand --emptyOutDir
          env $common VITE_SITE_ROLE=admin npx vite build --outDir ../dist/admin --emptyOutDir
      - name: role separation + QA/prod address guard
        run: |
          set -euo pipefail
          fail=0
          c() { grep -rl -- "$1" "$2" | wc -l; }
          for r in app brand admin; do
            [ -f dist/$r/index.html ] || { echo "FAIL $r index missing"; fail=1; }
            [ "$(find dist/$r -name '*.map' | wc -l)" = 0 ] || { echo "FAIL $r sourcemap"; fail=1; }
            [ "$(c zyyhhxyupizcqhxqnxuu dist/$r)" = 0 ] || { echo "FAIL $r contains PROD Supabase"; fail=1; }
          done
          [ "$(c doit-connect dist/brand)" = 0 ] && [ "$(c DoitApp dist/brand)" = 0 ] && [ "$(c admin-web dist/brand)" = 0 ] || { echo "FAIL brand role mixing"; fail=1; }
          [ "$(c admin-web dist/app)" = 0 ] || { echo "FAIL app has admin code"; fail=1; }
          [ "$(c DoitApp dist/admin)" = 0 ] && grep -q noindex dist/admin/index.html || { echo "FAIL admin role separation"; fail=1; }
          for r in app brand admin; do echo "$r files=$(find dist/$r -type f | wc -l) index_sha16=$(sha256sum dist/$r/index.html | cut -c1-16)"; done
          exit $fail

  real_ai:
    name: QA real-AI v67 (PROD writes 0)
    needs: gate
    runs-on: ubuntu-latest
    environment: ECHO-QA
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: QA runtime live check
        working-directory: product
        env:
          QA_ANON: ${{ env.QA_SUPABASE_ANON }}
        run: node qa-real/qa-core-live.mjs
