# ECHO 운영판 에이전트 실제 AI 재생 — deploy/final-app-web-20260925 브랜치용(2026-09-26 대표 「v1.9 실제 AI 검사」).
# - echo-ab-real.yml(PR #1 브랜치 전용)의 prod_agent 단계만 그대로 옮겼다. 다른 세션의 PR 브랜치를 건드리지 않으려고 따로 둔다.
# - 언제: 이 브랜치에서 product/spike/ab-20260925/run-request.json 이 바뀌어 push 될 때만(자동으로 돌지 않는다).
# - 키: 저장소 Secret `OPENAI_API_KEY_AB_TEST` 에서만 읽는다. 없으면 REAL_AI=BLOCKED 로 끝난다. 키는 코드·결과·로그에 쓰지 않는다.
# - 운영 DB·운영 함수·운영 Secret·배포(Netlify·Supabase)는 쓰지 않는다. 결과는 이 실행의 첨부물(7일)로만 남는다.
name: echo-agent-real-deploy-branch

on:
  push:
    branches: ['deploy/final-app-web-20260925']
    paths: ['product/spike/ab-20260925/run-request.json']

permissions:
  contents: read

concurrency:
  group: echo-ab-real
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 검사 도구(제품 의존성 아님)
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          npm init -y >/dev/null
          npm i --no-audit --no-fund typescript@5.8.3 js-tiktoken@1.0.21
      - name: 회귀 검사(AI 호출 0)
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
        run: node --test spike/ab-20260925/regression.test.mjs spike/ab-20260925/agentB.test.mjs spike/core-20260925/core.test.mjs spike/agent-v1-20260925/agent.test.mjs spike/agent-v1-20260925/admin.test.mjs
      - name: 운영판 에이전트 재생(doit-agent agent.ts · 운영 배포 전 실제 AI 확인)
        working-directory: product
        env:
          NODE_PATH: /tmp/tools/node_modules
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_AB_TEST }}
        run: |
          mkdir -p ../ab-out
          test "$(node -e "console.log(require('./spike/ab-20260925/run-request.json').mode)")" = prod_agent
          set +e
          MODELS=$(node -e "console.log(require('./spike/ab-20260925/run-request.json').models.join(','))")
          node spike/agent-v1-20260925/run-prod-agent.mjs --require-real --models "$MODELS" --out ../ab-out/prod-agent-result.md --json ../ab-out/prod-agent-result.json --perf ../ab-out/model-performance.jsonl
          code=$?
          echo "run-prod-agent exit=$code"
          if [ -f ../ab-out/prod-agent-result.json ]; then echo "::group::prod-agent-result.json"; cat ../ab-out/prod-agent-result.json; echo; echo "::endgroup::"; fi
          if [ -f ../ab-out/model-performance.jsonl ]; then echo "::group::model-performance.jsonl"; cat ../ab-out/model-performance.jsonl; echo "::endgroup::"; fi
          if [ -f ../ab-out/prod-agent-result.md ]; then echo "::group::prod-agent-result.md"; cat ../ab-out/prod-agent-result.md; echo "::endgroup::"; fi
          exit $code
      - name: 결과 첨부(7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-agent-real-${{ github.run_id }}
          path: ab-out/
          retention-days: 7
          if-no-files-found: ignore
