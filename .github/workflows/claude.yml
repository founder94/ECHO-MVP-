name: Claude Code

# ECHO 자동 왕복(AGENTS.md · .claude/skills/steward/SKILL.md)
#   Codex FAIL 댓글 끝 `@claude` → 이 워크플로가 PR head 에서 Claude 실행
#   → 수정 · 검사 · push(작업 브랜치만) → 인계 댓글(마지막 줄 `@codex review`) → Codex 재검수
# 안전: 저장소 주인/구성원만 · 봇 댓글 무시 · PR 당 한 번에 하나 · 인계 5회 넘으면 스스로 멈춤
#       병합 · 배포 · Secret · DB · Supabase 명령 없음(허용 도구에서 제외 + 저장소 훅이 한 번 더 막음)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          github.event.comment.user.type != 'Bot' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          github.event.comment.user.type != 'Bot' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          github.event.review.user.type != 'Bot' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Round gate (handoff ≤ 5 per PR)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event.pull_request != null }}
        run: |
          if [ "$IS_PR" != "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${NUM}/comments?per_page=100" \
                --jq '[.[] | select(.body | contains("echo-handoff to=codex"))] | length' | awk '{s+=$1} END {print s+0}')
          echo "handoff rounds so far: $n"
          if [ "$n" -ge 5 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            gh api "repos/${GITHUB_REPOSITORY}/issues/${NUM}/comments" -f body="<!-- echo-loop-stop rounds=${n} -->
          ## 자동 왕복 멈춤 — 수정 왕복 ${n}회(한도 5)
          무한 왕복을 막기 위해 Actions Claude 가 더 고치지 않습니다. 남은 결함은 대표 결정이 필요합니다.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_" > /dev/null
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Claude Code
        if: steps.gate.outputs.go == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm:*),Bash(npx tsc:*),Bash(npx eslint:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(git fetch:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(grep:*),Bash(find:*),Bash(mkdir:*),Bash(cp:*),Bash(zip:*),Bash(sha256sum:*)"
            --disallowedTools "Bash(supabase:*),Bash(npx supabase:*),Bash(gh pr merge:*),Bash(gh api:*),Bash(gh workflow:*),Bash(gh run:*),Bash(gh secret:*),Bash(git push --force:*),Bash(git push -f:*),Bash(git push origin main:*),Bash(git push origin echo-qa:*),Bash(git reset --hard:*),Bash(rm:*)"
            --append-system-prompt "ECHO rules: Follow AGENTS.md and .claude/skills/steward/SKILL.md if present on this branch. You are the implementer for this PR; Codex is the independent reviewer. When the triggering comment is a Codex review (first line <!-- echo-review from=codex ... verdict=FAIL -->): (1) check the reviewed SHA vs current PR head; (2) put Codex's reproduction into a test verbatim and confirm it fails; (3) make the minimal fix in real product code, never weaken tests; (4) run checks: cd product && npm ci && npm run -s type-check && npm run -s lint && the affected node --test files (and the full qa suite when feasible); (5) commit and git push to the current PR branch only (never main/echo-qa/prod, never force); (6) post exactly one new PR comment with gh pr comment whose first line is <!-- echo-handoff to=codex sha=<full 40-char new head SHA> round=<n> -->, listing changed files, before/after reproduction results, exact commands with exit codes and remaining limits, ending with the footer line '_Generated by [Claude Code](https://claude.ai/code)_' and then a final line '@codex review'. Never write @claude anywhere. If the request is a design-level change (multi-file restructure, API/schema change) or needs approval, do not change code; explain and stop. Never modify or deploy DB, RLS, migrations, secrets, API keys, models, payment, pricing, production data, Supabase Edge Functions, workflows; never merge; never make paid real API calls; never print secrets. Do not claim PASS for tests not actually run; separate mock / real / QA / production results. LLMs generate candidates only; final product decisions belong to the server state machine. Do not introduce hardcoded question arrays. Write PR comments in simple Korean."

      - name: Upload deployment ZIP
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: echo-webapp-deploy
          path: /tmp/echo-deploy/*.zip
          if-no-files-found: ignore
          retention-days: 7
