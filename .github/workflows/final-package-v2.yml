name: Final Package V2
on:
  push:
    branches:
      - deploy/final-app-web-20260925
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_SUPABASE_URL: "https://zyyhhxyupizcqhxqnxuu.supabase.co"
      VITE_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_ZLm0g3z7ad2-N0--kB5uFQ_sho1OGtn"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: deploy/final-app-web-20260925
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: product
        run: npm ci
      - name: Typecheck
        working-directory: product
        run: npm run type-check
      - name: Lint
        working-directory: product
        run: npm run lint
      - name: Build app
        working-directory: product
        run: npm run build:app
      - name: Build brand
        working-directory: product
        run: npm run build:brand
      - name: Package
        run: |
          mkdir -p /tmp/echo-deploy
          cd product/out-app
          zip -qr /tmp/echo-deploy/1_APP_여기에올릴것_doitmobile.zip .
          cd ../out-brand
          zip -qr /tmp/echo-deploy/2_BRAND_여기에올릴것_echo-mvp-doit.zip .
      - name: Verify
        run: |
          set -e
          test -f product/out-app/index.html
          test -f product/out-brand/index.html
          test -z "$(find product/out-app product/out-brand -type f -name '*.map' -print)"
          test -z "$(find product/out-app product/out-brand -type f -name '.env*' -print)"
          sha256sum /tmp/echo-deploy/*.zip
          stat -c '%n %s' /tmp/echo-deploy/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: echo-final-app-web-deploy-v2
          path: /tmp/echo-deploy/*.zip
          if-no-files-found: error
          retention-days: 7
