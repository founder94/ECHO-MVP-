<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08070c" />
    <title>DO IT COMPANY | JUST TRY.</title>
    <meta name="description" content="사람은 프로필보다, 함께한 행동에서 더 많이 보이니까. DO IT COMPANY · ECHO" />
    <meta property="og:title" content="DO IT COMPANY | JUST TRY." />
    <meta property="og:description" content="사람은 프로필보다, 함께한 행동에서 더 많이 보이니까." />
    <meta property="og:image" content="https://do-it.company/brand/doit-earth-original.png" />
    <meta property="og:url" content="https://do-it.company/" />
    <!-- 온보딩(1%→100%)이 실제로 쓰는 그림. 이게 늦게 오면 심볼이 화면에서 통째로 사라지므로 가장 먼저 받는다. -->
    <link rel="preload" as="image" href="/brand/doit-symbol-intro.webp" type="image/webp" fetchpriority="high" />
    <!-- 다음 화면(랜딩) 배경. 같은 그림·같은 자리 그대로이고, 받아오는 차례만 뒤로 둔다.
         (앞서 받으면 화면을 그리는 코드와 온보딩 심볼이 밀려 심볼이 늦게 뜬다.) -->
    <link rel="preload" as="image" href="/brand/doit-earth-original.png" fetchpriority="low" />
  <!-- 2026-10-09 대표 승인: 글꼴은 주아체(Jua) 하나 — src/fonts/jua.css(저장소 안 public/fonts/jua). 구글 글꼴 링크 0. 아이콘 글꼴(font-awesome·remixicon)만 그대로. -->
  <link rel="stylesheet" media="print" data-echo-deferred-font href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" media="print" data-echo-deferred-font href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">
  <!-- 화면 안 직접 스크립트(onload) 0 — CSP script-src 'self'. 아이콘 글꼴은 /font-styles.js 가 뒤에서 받는다(PR #149 보안 보강). -->
  <style>
    html, body, #root { min-height: 100%; margin: 0; }
    body { background: #08070c; }
  </style>
    <script src="/font-styles.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
